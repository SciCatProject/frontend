@if (configs$ | async; as configs) {
  @let active = getActive(configs);
  @let waiting = getWaiting(configs);
  <button
    type="button"
    class="advanced-search"
    [class.active]="active.length"
    [class.icon-only]="iconOnly"
    [class.open]="isOpen()"
    [matTooltip]="
      draft()
        ? 'Changes are not applied yet, open to apply them'
        : waiting
          ? 'A filter has no value yet and is not applied, open to fill it in'
          : iconOnly
            ? 'Advanced search'
            : ''
    "
    aria-label="Advanced search"
    (click)="open(configs)"
    data-cy="advanced-search-button"
  >
    <mat-icon>tune</mat-icon>
    @if (!iconOnly) {
      Advanced search
    }
    @if (active.length) {
      <span class="badge" data-cy="condition-count">{{ active.length }}</span>
    }
    @if (draft()) {
      <span class="draft-dot" aria-hidden="true" data-cy="condition-draft"
        >!</span
      >
    } @else if (waiting) {
      <span class="draft-dot" aria-hidden="true" data-cy="condition-waiting"
        >!</span
      >
    }
  </button>
}

<div [ngStyle]="{ display: hidden ? 'none' : '' }" class="quantity-value-box">
  @for (
    props of uischema | customLayoutChildrenRenderProps: schema : path;
    track trackElement($index, props)
  ) {
    <div class="quantity-value-element">
      <jsonforms-outlet [renderProps]="props"></jsonforms-outlet>
    </div>
  }
</div>

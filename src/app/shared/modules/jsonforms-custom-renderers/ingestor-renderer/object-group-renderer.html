<mat-card class="anyof-group">
  <mat-card-title
    >
    {{ objectTitle }} 
    &nbsp;
    <mat-icon
      *ngIf="description"
      matSuffix
      class="field-description-icon"
      [matTooltip]="description"
      matTooltipPosition="above"
    >
      info_outline
    </mat-icon>
    <span class="spacer"></span>
    @if (this.error !== null && this.error !== "") {
      <mat-icon
        color="warn"
        matBadgeColor="warn"
        matTooltip="{{ this.error }}"
        matTooltipClass="error-message-tooltip"
      >
        error_outline
      </mat-icon>
    }
  </mat-card-title>
  <mat-card-content>
    @if (errorRecursiveStructure === false) {
      <div>
        <jsonforms-outlet
          [uischema]="detailUiSchema"
          [schema]="scopedSchema"
          [path]="propsPath"
        >
        </jsonforms-outlet>
      </div>
    }
    @if (errorRecursiveStructure) {
      <p>
        <mat-icon color="warn">error_outline</mat-icon>
        Recursive data structure in selected JSON Schema detected.
      </p>
    }
  </mat-card-content>
</mat-card>

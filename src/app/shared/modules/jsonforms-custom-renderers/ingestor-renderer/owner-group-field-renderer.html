<div>
  @if (userOwnerGroups && userOwnerGroups.length > 0) {
    <mat-form-field
      [ngStyle]="{ display: hidden ? 'none' : '' }"
      class="custom-input-box"
    >
      <mat-label>{{ label }}</mat-label>
      <input
        type="text"
        class="custom-input-box"
        matInput
        [id]="id"
        [matAutocomplete]="auto"
        [formControl]="form"
        (input)="onChange($event)"
        (focus)="focused = true"
        (focusout)="focused = false"
      />
      <mat-autocomplete
        #auto="matAutocomplete"
        (optionSelected)="onSelectAutocompleteValue($event)"
      >
        @for (ownerGroup of userOwnerGroups; track ownerGroup) {
          <mat-option [value]="ownerGroup"> {{ ownerGroup }} </mat-option>
        }
      </mat-autocomplete>
      @if (shouldShowUnfocusedDescription() || focused) {
        <mat-icon
          matSuffix
          class="field-description-icon"
          [matTooltip]="description"
          matTooltipPosition="above"
          >info_outline</mat-icon>
      }
      <mat-error>{{ error }}</mat-error>
    </mat-form-field>
  }
  @if (!userOwnerGroups || userOwnerGroups.length === 0) {
    <mat-form-field
      [ngStyle]="{ display: hidden ? 'none' : '' }"
      class="custom-input-box"
    >
      <mat-label>{{ label }}</mat-label>
      <input
        type="text"
        class="custom-input-box"
        matInput
        [id]="id"
        [formControl]="form"
        (input)="onChange($event)"
        (focus)="focused = true"
        (focusout)="focused = false"
      />
    </mat-form-field>
  }
</div>

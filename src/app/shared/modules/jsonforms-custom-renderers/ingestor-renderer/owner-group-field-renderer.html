<div>
  <mat-form-field
  [ngStyle]="{ display: hidden ? 'none' : '' }"
  *ngIf="userOwnerGroups && userOwnerGroups.length > 0"
  class="custom-input-box"
  >
  <mat-label>{{ label }}</mat-label>
  <input
  type="text"
  class="custom-input-box"
  matInput
  [id]="id"
  [matAutocomplete]="auto"
  [formControl]="form"
  (input)="onChange($event)"
  (focus)="focused = true"
  (focusout)="focused = false"
  />
  <mat-autocomplete
  #auto="matAutocomplete"
  (optionSelected)="onSelectAutocompleteValue($event)"
  >
  <mat-option
  *ngFor="let ownerGroup of userOwnerGroups"
  [value]="ownerGroup"
  >
  {{ ownerGroup }}
  </mat-option>
  </mat-autocomplete>
  <mat-icon
  *ngIf="description"
  matSuffix
  class="field-description-icon"
  [matTooltip]="description"
  matTooltipPosition="above"
  >info_outline</mat-icon>
  <mat-error>{{ error }}</mat-error>
  </mat-form-field>
  <mat-form-field
  [ngStyle]="{ display: hidden ? 'none' : '' }"
  *ngIf="!userOwnerGroups || userOwnerGroups.length === 0"
  class="custom-input-box"
  >
  <mat-label>{{ label }}</mat-label>
  <input
  type="text"
  class="custom-input-box"
  matInput
  [id]="id"
  [formControl]="form"
  (input)="onChange($event)"
  (focus)="focused = true"
  (focusout)="focused = false"
  />
  </mat-form-field>
</div>

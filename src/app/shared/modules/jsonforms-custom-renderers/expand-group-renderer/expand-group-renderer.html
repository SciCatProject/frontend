@if (isExpandable()) {
  <mat-expansion-panel #panel>
    <mat-expansion-panel-header>
      <mat-panel-title> {{ uischema?.["label"] || "Group" }}</mat-panel-title>
    </mat-expansion-panel-header>
    @if (panel.expanded) {
      @for (el of uischema.elements; track $index; let idx = $index) {
        <div class="group-wrapper">
          <jsonforms-outlet [renderProps]="getProps(idx)"></jsonforms-outlet>
        </div>
      }
    }
  </mat-expansion-panel>
} @else {
  <div class="group-wrapper">
    <h3>{{ uischema?.["label"] || "Group" }}</h3>
    @for (el of uischema.elements; track el; let idx = $index) {
      <div>
        <jsonforms-outlet [renderProps]="getProps(idx)"></jsonforms-outlet>
      </div>
    }
  </div>
}

@if (visible) {
  <!-- disabled buttons can't take focus or pointer events, so the wrapper
       carries their tooltip; it is then focusable, and the tooltip shows on
       keyboard focus and is linked as its accessible description. Enabled
       buttons carry their tooltip themselves -->
  <span
    class="action-wrapper"
    [matTooltip]="tooltip"
    [matTooltipDisabled]="!tooltip || !disabled"
    [attr.tabindex]="tooltip && disabled ? 0 : null"
    [attr.aria-label]="tooltip && disabled ? actionConfig.label : null"
  >
    @if (buttonStyle.raised) {
      <button
        mat-raised-button
        (click)="performAction()"
        [color]="buttonStyle.color"
        [disabled]="disabled"
        [matTooltip]="tooltip"
        [matTooltipDisabled]="!tooltip || disabled"
      >
        @if (useMatIcon) {
          <mat-icon>{{ actionConfig.mat_icon }}</mat-icon>
        }
        @if (useIcon) {
          <img src="{{ actionConfig.icon }}" />
        }
        {{ actionConfig.label }}
      </button>
    }
    @if (!buttonStyle.raised) {
      <button
        mat-button
        [color]="buttonStyle.color"
        (click)="performAction()"
        [disabled]="disabled"
        [matTooltip]="tooltip"
        [matTooltipDisabled]="!tooltip || disabled"
      >
        @if (useMatIcon) {
          <mat-icon>{{ actionConfig.mat_icon }}</mat-icon>
        }
        @if (useIcon) {
          <img src="{{ actionConfig.icon }}" />
        }
        {{ actionConfig.label }}
      </button>
    }
  </span>
}

@if (iframeEnabled) {
  @if (iframeVisible){
    <div
      class="configurable-action-iframe-backdrop"
      (click)="closeIframe()"
    ></div>

    <section
      class="configurable-action-iframe-panel mat-elevation-z8"
      [style.width]="iframeWidth"
      [style.height]="iframeHeight"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="iframeTitle"
    >
      <header class="configurable-action-iframe-header">
        <span class="configurable-action-iframe-title">{{ iframeTitle }}</span>
        <div class="configurable-action-iframe-actions">
          <button
            mat-icon-button
            type="button"
            aria-label="Open iframe in a new tab"
            title="Open in new tab"
            (click)="openIframeInNewTab()"
          >
            <mat-icon>open_in_new</mat-icon>
          </button>
          <button
            mat-icon-button
            type="button"
            aria-label="Close iframe"
            title="Close"
            (click)="closeIframe()"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </header>
      <div class="configurable-action-iframe-content">
        <iframe
          #actionIframe
          class="configurable-action-iframe"
          [attr.name]="iframeName"
          [attr.title]="iframeTitle"
          (load)="onIframeLoad()"
        ></iframe>

        @if (iframeLoading){
          <div
            class="configurable-action-iframe-loading"
            aria-live="polite"
          >
            <mat-progress-spinner
              color="primary"
              diameter="40"
              mode="indeterminate"
            ></mat-progress-spinner>
            <span>Loading...</span>
          </div>
        }
      </div>
    </section>
  }
  @else{
    <iframe
      #actionIframe
      class="configurable-action-hidden-iframe"
      [attr.name]="iframeName"
      [attr.title]="iframeTitle"
    ></iframe>
  }
}

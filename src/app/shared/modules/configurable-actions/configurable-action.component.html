@if (visible) {
  @if (buttonStyle.raised) {
    <button
      mat-raised-button
      (click)="performAction()"
      [color]="buttonStyle.color"
      [disabled]="disabled"
    >
      @if (useMatIcon) {
        <mat-icon>{{ actionConfig.mat_icon }}</mat-icon>
      }
      @if (useIcon) {
        <img src="{{ actionConfig.icon }}" />
      }
      {{ actionConfig.label }}
    </button>
  }
  @if (!buttonStyle.raised) {
    <button
      mat-button
      [color]="buttonStyle.color"
      (click)="performAction()"
      [disabled]="disabled"
    >
      @if (useMatIcon) {
        <mat-icon>{{ actionConfig.mat_icon }}</mat-icon>
      }
      @if (useIcon) {
        <img src="{{ actionConfig.icon }}" />
      }
      {{ actionConfig.label }}
    </button>
  }
}

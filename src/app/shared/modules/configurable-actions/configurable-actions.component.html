<div class="configurable-actions">
  @for (actionConfig of sortedActionsConfig; track actionConfig) {
    <configurable-action
      [actionConfig]="actionConfig"
      [actionItems]="actionItems"
      [buttonStyle]="buttonsStyle"
      (actionFinished)="actionFinished.emit($event)"
    >
    </configurable-action>
  }
</div>

<mat-card class="empty-content">
  <mat-card-content>
    <div class="content-wrapper">
      <mat-icon class="content-icon">{{ icon }}</mat-icon>
      <span class="message">{{ message }}</span>
      @if (showReload || actionButtons.length > 0) {
        <div class="actions">
          <button
            mat-icon-button
            color="primary"
            (click)="onReload()"
            matTooltip="Reload"
          >
            <mat-icon>autorenew</mat-icon>
          </button>
          @for (button of actionButtons; track button; let i = $index) {
            <button
              mat-button
              [color]="button.color || 'primary'"
              (click)="onActionClick(i)"
            >
              @if (button.icon) {
                <mat-icon>{{ button.icon }}</mat-icon>
              }
              {{ button.label }}
            </button>
          }
        </div>
      }
    </div>
  </mat-card-content>
</mat-card>

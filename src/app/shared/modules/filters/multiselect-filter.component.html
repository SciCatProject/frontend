<mat-form-field [id]="key">
  <mat-label>{{ label }} </mat-label>
  <mat-chip-grid #chipList>
    @for (item of currentFilter$ | async; track item) {
      <mat-chip-row [removable]="true" (removed)="itemRemoved(item)"
        >{{ getLabel(item) || "No item" }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
    }
  </mat-chip-grid>
  <input
    #input
    (input)="onInput($event)"
    [value]="input$ | async"
    matInput
    class="item-input"
    [matChipInputFor]="chipList"
    [matAutocomplete]="mutiselection"
    matTooltip="{{ tooltip }}"
    matTooltipPosition="after"
  />
  @if (appConfig.autoApplyFilters) {
    <span
      matSuffix
      class="enter-hint"
      matTooltip="Press Enter to apply"
      matTooltipPosition="after"
      matTooltipShowDelay="500"
      >↵</span
    >
  }

  <mat-autocomplete #mutiselection="matAutocomplete">
    @for (fc of suggestions$ | async; track fc) {
      <mat-option (onSelectionChange)="itemSelected(fc)">
        <span>{{ getLabel(fc._id) }} | </span>
        <small>{{ getFacetCount(fc) }}</small>
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>

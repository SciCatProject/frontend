@if (isOwner) {
  <mat-card
    class="dropzone"
    appDragAndDrop
    (fileDropped)="onFileDropped($event)"
  >
    <mat-card-content>
      <input
        class="instructions"
        type="file"
        #fileDropRef
        id="fileDropRef"
        accept="image/*,application/pdf"
        multiple
        (change)="onFilePicked($event.target['files'])"
      />
      <div fxLayout="column" style="align-items: center">
        <div class="instructions">Drop a file here</div>
        <div class="instructions">or</div>
        <div class="instructions">
          <button mat-raised-button color="accent" (click)="triggerFileDrop()">
            Browse
          </button>
        </div>
        <div class="instructions font-small">
          Accepted file formats: image/*, application/pdf
        </div>
      </div>
    </mat-card-content>
  </mat-card>
}

@if (isOwner) {
  <mat-card class="file-picker">
    <mat-card-content>
      <div class="mat-headline-6">
        Choose an image to upload
        <div class="font-small">
          Accepted file formats: image/*, application/pdf
        </div>
      </div>
      <button mat-raised-button color="accent" (click)="triggerFileDrop()">
        Browse
      </button>
    </mat-card-content>
  </mat-card>
}
<div class="grid-container">
  @for (attachment of attachments; track attachment) {
    <mat-card class="attachment-card">
      <mat-card-content class="attachment-content">
        <img
          data-cy="attachment-thumbnail"
          [src]="getImageUrl(attachment.thumbnail)"
          (error)="onAttachmentImageError($event)"
          (click)="openAttachment(attachment.thumbnail)"
        />
        @if (isOwner) {
          <form
            (submit)="
              onSubmitCaption(
                attachmentIdWithLegacyFallback(attachment),
                caption.value
              )
            "
          >
            <mat-form-field>
              <mat-label>Caption</mat-label>
              <input
                matInput
                id="caption"
                value="{{ attachment.caption }}"
                #caption
              />
            </mat-form-field>
            <button
              mat-stroked-button
              type="submit"
              color="primary"
              class="submit-button"
            >
              Submit
            </button>
          </form>
        }
      </mat-card-content>
      <mat-card-actions>
        <button
          mat-button
          class="download-button"
          (click)="onDownloadAttachment(attachment)"
        >
          <mat-icon>download</mat-icon>
          Download
        </button>
        @if (isOwner) {
          <button
            mat-button
            class="delete-button"
            (click)="
              onDeleteAttachment(attachmentIdWithLegacyFallback(attachment))
            "
          >
            <mat-icon>delete</mat-icon>
            Remove
          </button>
        }
      </mat-card-actions>
    </mat-card>
  }
</div>

@if (metadata) {
  <div
    id="scientific-metadata-table"
    class="metadataTable scientific-metadata-table"
    [class.metadataTable-raw-context-menu-enabled]="
      rowContextMenuEnabled
    "
  >
    <dynamic-mat-table
      [tableName]="tableName"
      [showReload]="showReloadData"
      [dir]="direction"
      [rowHeight]="rowHeight"
      [columns]="columns"
      [pending]="pending"
      [setting]="setting"
      [sticky]="stickyHeader"
      [dataSource]="dataSource"
      [pagination]="pagination"
      [pagingMode]="pagingMode"
      [showNoData]="showNoData"
      [rowSelectionMode]="rowSelectionMode"
      [printConfig]="printConfig"
      [showProgress]="showProgress"
      [showGlobalTextSearch]="showGlobalTextSearch"
      [rowContextMenuItems]="rowContextMenuItems"
      [rowContextMenuEnabled]="rowContextMenuEnabled"
      rowContextMenuClass="metadata-entry-context-menu"
      style="height: 100%"
      [emptyMessage]="'No metadata available'"
      [emptyIcon]="'folder'"
      [disableBorder]="true"
      (onRowEvent)="onRowEvent($event)"
    >
    </dynamic-mat-table>
  </div>
}

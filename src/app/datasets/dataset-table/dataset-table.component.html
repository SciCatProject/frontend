<dynamic-mat-table
  #datasetTable
  [tableName]="tableName"
  [columns]="columns"
  [pending]="pending"
  [setting]="setting"
  [pagingMode]="paginationMode"
  [dataSource]="dataSource"
  [pagination]="pagination"
  [rowSelectionMode]="rowSelectionMode"
  [showGlobalTextSearch]="true"
  [showPublicScopeToggle]="(loggedIn$ | async) === true"
  [publicScope]="publicScope$ | async"
  [myDataCount]="myDataCount$ | async"
  [publicDataCount]="publicDataCount$ | async"
  (publicScopeChange)="onPublicScopeChange($event)"
  [globalTextSearch]="globalTextSearch"
  (globalTextSearchChange)="onTextSearchChange($event)"
  (globalTextSearchApply)="onTextSearchAction()"
  [globalTextSearchPlaceholder]="'Free-text search...'"
  [showAdvancedSearch]="appConfig.scienceSearchEnabled"
  [activeAdvancedFilters]="activeAdvancedFilters$ | async"
  (advancedSearchClick)="openAdvancedSearchDialog($event)"
  (advancedSearchClearAll)="clearAdvancedConditions()"
  (removeAdvancedFilter)="onRemoveAdvancedFilter($event)"
  [localization]="localization"
  [selectionIds]="selectionIds"
  (paginationChange)="onPageChange($event)"
  (onRowEvent)="onRowEvent($event)"
  (settingChange)="onSettingChange($event)"
  (onTableEvent)="onTableEvent($event)"
  class="mat-elevation-z2 dataset-table"
  [emptyMessage]="'No datasets available'"
  [emptyIcon]="'folder'"
>
</dynamic-mat-table>

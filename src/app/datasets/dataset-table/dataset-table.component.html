<dynamic-mat-table
  #datasetTable
  [tableName]="tableName"
  [columns]="columns"
  [pending]="pending"
  [setting]="setting"
  [pagingMode]="paginationMode"
  [dataSource]="dataSource"
  [pagination]="pagination"
  [rowSelectionMode]="rowSelectionMode"
  [showGlobalTextSearch]="true"
  [globalTextSearch]="globalTextSearch"
  (globalTextSearchChange)="onTextSearchChange($event)"
  (globalTextSearchApply)="onTextSearchAction()"
  [globalTextSearchPlaceholder]="'Dataset name, Run number...'"
  [localization]="localization"
  [selectionIds]="selectionIds"
  (paginationChange)="onPageChange($event)"
  (onRowEvent)="onRowEvent($event)"
  (settingChange)="onSettingChange($event)"
  (onTableEvent)="onTableEvent($event)"
  class="mat-elevation-z2 dataset-table"
  [emptyMessage]="'No datasets available'"
  [emptyIcon]="'folder'"
>
  @if (appConfig.scienceSearchEnabled) {
    <advanced-search-button
      table-search-action
      [iconOnly]="true"
      scope="dataset"
      [keySource]="keySource"
      [unitsEnabled]="appConfig.scienceSearchUnitsEnabled"
      (conditionsApplied)="onConditionsApplied($event)"
    ></advanced-search-button>
  }
  @if (appConfig.scienceSearchEnabled) {
    <advanced-search-chips
      table-toolbar
      [configs]="conditionConfigs$ | async"
      (filterSelect)="advancedSearchButton.openFilter($event)"
      (filterRemove)="advancedSearchButton.removeFilter($event)"
      (clearAll)="advancedSearchButton.clearFilters()"
    ></advanced-search-chips>
  }
</dynamic-mat-table>

<div class="dashboard-main">
  <mat-sidenav-container [hasBackdrop]="false">
    <mat-sidenav-content>
      <div fxLayout="row" fxLayout.xs="column" class="dashboard-header">
        <div class="action-column" fxFlex="14" fxFlex.lt-xl="20"></div>
        <div class="table-column" fxFlex="85" fxFlex.lt-xl="80">
          @if (this.loggedIn$ | async) {
            <dataset-table-actions></dataset-table-actions>
          }
        </div>
      </div>

      <div fxLayout="row" fxLayout.xs="column">
        <div class="action-column" fxFlex="14" fxFlex.lt-xl="20">
          <datasets-filter></datasets-filter>
          @if (this.loggedIn$ | async) {
            <ingestor-creation
              #ingestor
              style="display: none"
            ></ingestor-creation>
            @if (appConfig.addDatasetEnabled) {
              <mat-card class="add-card" (click)="openDialog()">
                <mat-card-content>
                  <mat-icon> add_circle </mat-icon>
                  Create Dataset
                </mat-card-content>
              </mat-card>
            }
            @if (!appConfig.shoppingCartOnHeader && (nonEmpty$ | async)) {
              <div>
                <batch-card></batch-card>
              </div>
            }
          }
        </div>
        <div class="table-column" fxFlex="85" fxFlex.lt-xl="80">
          <dataset-table
            (rowClick)="onRowClick($event)"
            (pageChange)="onPageChange($event)"
          ></dataset-table>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

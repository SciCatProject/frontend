<mat-card>
  @if (datablocks$ | async; as datablocks) {
    <h3>Datablocks: {{ datablocks.length }}</h3>
    @for (block of datablocks; track block) {
      <ul>
        <li>{{ block._id }}</li>
        <ul>
          <li>{{ block.archiveId }}</li>
        </ul>
      </ul>
    }
  }

  <mat-card-actions>
    <button mat-raised-button class="reset-button" (click)="resetDataset()">
      Reset Status
    </button>
  </mat-card-actions>
</mat-card>

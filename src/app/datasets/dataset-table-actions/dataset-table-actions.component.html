<div class="mode-container">
  @if (modes.length > 0) {
    <mat-button-toggle-group
      [value]="currentArchViewMode"
      [disabled]="!profileLoaded"
    >
      @for (mode of modes; track mode.id) {
        <mat-button-toggle
          (click)="onModeChange(mode)"
          [value]="mode.id"
          [ngClass]="mode.id"
          [matTooltip]="mode.tooltip ?? ''"
        >
          {{ mode.label }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>
  }

  @if (hasModeCheckbox) {
    <mat-checkbox
      class="mode-checkbox"
      data-cy="dataset-view-mode-checkbox"
      [class.hidden]="!selectedModeCheckbox"
      [checked]="currentArchViewModeChecked"
      (change)="onModeCheckboxChange($event.checked)"
    >
      {{ selectedModeCheckbox?.label }}
    </mat-checkbox>
  }
</div>

<div class="action-container" [class.hidden]="loading$ | async">
  @if (appConfig.batchActionsEnabled) {
    <configurable-actions
      [actionsConfig]="batchActionsConfig"
      [actionItems]="actionItems"
      [buttonsStyle]="actionButtonsStyle"
      (actionFinished)="onActionFinished($event)"
    >
    </configurable-actions>
  }

  @if (appConfig.shoppingCartEnabled) {
    <button
      id="addToBatchButton"
      mat-button
      [disabled]="isEmptySelection()"
      class="add-batch"
      (click)="onAddToBatch()"
      color="primary"
    >
      <mat-icon>library_add</mat-icon>
      Add to Selection
    </button>
  }
</div>

<div style="clear: both"></div>

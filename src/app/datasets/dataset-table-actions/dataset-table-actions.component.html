<div class="mode-container">
  <div
    class="public-toggle"
    *ngIf="(loggedIn$ | async) && searchPublicDataEnabled"
  >
    <button
      mat-stroked-button
      [class.active]="
        currentPublicViewMode === '' || currentPublicViewMode === false
      "
      (click)="onViewPublicChange(false)"
    >
      My data
    </button>
    <button
      mat-stroked-button
      [class.active]="currentPublicViewMode === true"
      (click)="onViewPublicChange(true)"
    >
      Public data
    </button>
  </div>

  <mat-button-toggle-group
    [value]="currentArchViewMode"
    *ngIf="appConfig.archiveWorkflowEnabled"
  >
    <mat-button-toggle
      *ngFor="let mode of modes"
      (click)="onModeChange(mode)"
      [value]="mode.id"
      [ngClass]="mode.id"
    >
      {{ mode.label }}
    </mat-button-toggle>
  </mat-button-toggle-group>
</div>

<div class="action-container" [class.hidden]="loading$ | async">
  <configurable-actions
    *ngIf="appConfig.batchActionsEnabled"
    [actionsConfig]="batchActionsConfig"
    [actionItems]="actionItems"
    [buttonsStyle]="actionButtonsStyle"
    (actionFinished)="onActionFinished($event)"
  >
  </configurable-actions>

  <button
    id="addToBatchButton"
    mat-button
    [disabled]="isEmptySelection()"
    *ngIf="appConfig.shoppingCartEnabled"
    class="add-batch"
    (click)="onAddToBatch()"
    color="primary"
  >
    <mat-icon>library_add</mat-icon>
    Add to Selection
  </button>
</div>

<div style="clear: both"></div>

@if (dataset$ | async) {
  @if (dataset$) {
    <div fxLayout="row" fxLayout.xs="column">
      <div fxFlex="100%">
        @if (true && editingAllowed && appConfig.jsonMetadataEnabled) {
          <mat-card>
            <mat-card-content>
              <ngx-json-viewer
                data-cy="metadata-json-view"
                [json]="datasetWithout$ | async"
                [expanded]="false"
              >
              </ngx-json-viewer>
            </mat-card-content>
          </mat-card>
        }
      </div>
    </div>
  }
}

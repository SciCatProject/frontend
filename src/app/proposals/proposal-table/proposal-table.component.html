<dynamic-mat-table
  [tableName]="tableName"
  [columns]="columns"
  [pending]="pending"
  [setting]="setting"
  [pagingMode]="paginationMode"
  [dataSource]="dataSource"
  [pagination]="pagination"
  [rowSelectionMode]="rowSelectionMode"
  [showGlobalTextSearch]="true"
  [globalTextSearch]="globalTextSearch"
  (globalTextSearchChange)="onGlobalTextSearchChange($event)"
  (globalTextSearchApply)="onGlobalTextSearchAction()"
  [globalTextSearchPlaceholder]="'Free-text search...'"
  [localization]="localization"
  [sideFilterCollapsed]="sideFilterCollapsed"
  (paginationChange)="onPageChange($event)"
  (onRowEvent)="onRowClick($event)"
  (settingChange)="onSettingChange($event)"
  (onTableEvent)="onTableEvent($event)"
  class="mat-elevation-z2 proposal-table"
  [emptyMessage]="'No proposals available. Please reset the filters and try again'"
  [emptyIcon]="'folder'"
>
</dynamic-mat-table>

<div fxLayout="row" fxLayout.lt-lg="column">
  <div fxFlex="14" fxFlex.lt-xl="10"></div>
  <div fxFlex="60" fxFlex.lt-xl="80">
    <mat-button-toggle-group [(ngModel)]="currentMode">
      @for (mode of modes; track mode) {
        <mat-button-toggle
          [value]="mode"
          [ngClass]="mode"
          (click)="onModeToggleChange()"
        >
          {{ mode | titleCase }}
        </mat-button-toggle>
      }
    </mat-button-toggle-group>
    <app-table
      [data]="jobs"
      [columns]="tableColumns"
      [paginate]="paginate"
      [currentPage]="currentPage$ | async"
      [dataCount]="jobsCount$ | async"
      [dataPerPage]="jobsPerPage$ | async"
      (pageChange)="onPageChange($event)"
      (sortChange)="onSortChange($event)"
      (rowClick)="onRowClick($event)"
    ></app-table>
    @if (jobs.length === 0) {
      <div class="no-jobs-message">
        <mat-card
          ><mat-card-content>
            <mat-icon>info</mat-icon> You have no jobs yet.
          </mat-card-content></mat-card
        >
      </div>
    }
  </div>
  <div fxFlex="26" fxFlex.lt-xl="10"></div>
</div>

# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

worker_processes auto;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    server {
        listen       8080 default_server;
        listen       [::]:8080 default_server;
        server_name  _;
        root         /usr/share/nginx/html;


        # Cache strategy so browsers pick up new deploys:
        # - index.html (and SPA route fallbacks) and /assets/ (config.json,
        #   theme.json, images, ...) are not content-hashed, so browsers must
        #   revalidate them on every load (cheap 304 via ETag/Last-Modified).
        # - Build output with a content hash in its name (main-XXXXXXXX.js,
        #   chunk-XXXXXXXX.js, styles-XXXXXXXX.css, fonts, ...) changes name on
        #   every deploy, so it can be cached forever.
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }

        location ^~ /assets/ {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location ~ "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|ico)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            # A missing chunk must 404, not fall back to (cached) index.html
            try_files $uri =404;
        }

        # Enable gzip to compress large files
        gzip on;
        gzip_vary on;
        gzip_types
          text/plain
          text/css
          text/js
          text/xml
          text/javascript
          application/javascript
          application/json
          application/xml
          application/rss+xml
          image/svg+xml
          image/png;
        gzip_min_length 1024;
        gzip_proxied expired no-cache no-store private auth;
    }

